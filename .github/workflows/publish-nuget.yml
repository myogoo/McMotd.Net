name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.410
      - name: Select the repository SDK
        run: dotnet new globaljson --sdk-version 7.0.410 --roll-forward latestPatch
      - name: Test core and Razor
        run: dotnet test McMotdParser.Test/McMotdParser.Test.csproj --configuration Release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Install the Android 33 SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-33' 'build-tools;33.0.2'"
      - name: Pack all published targets
        run: |
          dotnet pack McMotdParser/McMotdParser.csproj --configuration Release --no-build --output artifacts
          dotnet pack McMotdParser.Razor/McMotdParser.Razor.csproj --configuration Release --no-build --output artifacts
          dotnet pack McMotdParser.MAUI/McMotdParser.MAUI.csproj --configuration Release -p:GeneratePackageOnBuild=false --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
